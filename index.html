<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A contact form that sends submissions directly to WhatsApp." />
  <link rel="stylesheet" href="style.css" />
  <title>Contact via WhatsApp</title>
</head>
<body>
  <main class="page">
    <form id="contact-form" class="form-card" novalidate>
      <h1 class="form-title">Get in Touch</h1>
      <p class="form-subtitle">Fill in your details and we'll continue the chat on WhatsApp.</p>

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" autocomplete="name" required />
        <span class="error-msg" data-error-for="name"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        <span class="error-msg" data-error-for="email"></span>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <div class="phone-row">
          <select id="country-code" name="country-code" aria-label="Country code"></select>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="6 12 34 56 78"
            autocomplete="tel-national"
            inputmode="numeric"
            required
          />
        </div>
        <span class="error-msg" data-error-for="phone"></span>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="How can we help?" rows="4"></textarea>
      </div>

      <!--
        Honeypot field — invisible to real visitors, but most bots that
        auto-fill every input on a page will fill this in too. If it has
        a value on submit, we treat the whole submission as spam.
        Do not give this a "display: none" rule alone — some bots skip
        those. It's positioned off-screen instead, and hidden from
        screen readers and keyboard tabbing as a courtesy to real users.
      -->
      <div class="field honeypot-field" aria-hidden="true">
        <label for="company">Company</label>
        <input
          type="text"
          id="company"
          name="company"
          tabindex="-1"
          autocomplete="off"
        />
      </div>

      <button type="submit" class="submit-btn">
        <span>Send via WhatsApp</span>
      </button>
    </form>

    <!--
      Toast region: lives outside the form so it persists even if the
      form is reset. role="status" + aria-live="polite" means screen
      readers announce it automatically without stealing focus.
    -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span class="toast-icon" aria-hidden="true">✓</span>
      <span class="toast-text"></span>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
